<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio | Actuariat &amp; Finance</title>
    <script>
      // GitHub Pages SPA redirect
      // Segments to keep from the path (1 = /portfolio)
      var segmentCount = 1
      var l = window.location
      var base = l.pathname.split('/').slice(0, 1 + segmentCount).join('/')
      var rest = l.pathname.split('/').slice(1 + segmentCount).join('/')
      var target =
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '/?p=' + encodeURIComponent('/' + rest) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      window.location.replace(target)
    </script>
  </head>
  <body></body>
</html>
